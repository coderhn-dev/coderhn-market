name: Deploy a Netlify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_USE_MOCKS: 'true'
  VITE_DEMO_MODE: 'true'
  # VITE_API_URL: ${{ vars.VITE_API_URL }}   # habilitar al conectar el backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.43

      # Vite 8 corre sobre Node (>= 20.19)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Typecheck y build
        run: bun run build

      - name: Deploy de vista previa (PR)
        if: github.event_name == 'pull_request'
        id: preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PR_NUMBER: ${{ github.event.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          bunx netlify-cli@27.16.2 deploy \
            --dir=dist --no-build \
            --alias="pr-$PR_NUMBER" \
            --message="PR #$PR_NUMBER: $PR_TITLE" \
            --json > deploy.json
          echo "url=$(jq -r '.deploy_url' deploy.json)" >> "$GITHUB_OUTPUT"

      - name: Comentar URL de vista previa
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Vista previa en Netlify: ${{ steps.preview.outputs.url }}`,
            });

      - name: Deploy a producción
        if: github.event_name != 'pull_request'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          bunx netlify-cli@27.16.2 deploy \
            --dir=dist --no-build --prod \
            --message="${{ github.sha }}"
